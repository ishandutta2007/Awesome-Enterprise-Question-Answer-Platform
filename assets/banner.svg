<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.7)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.85)" />
    </linearGradient>

    <linearGradient id="glowPulse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </linearGradient>

    <!-- Drop Shadows and Filters -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(148, 163, 184, 0.08)" stroke-width="1" />
    </pattern>

    <!-- Animations -->
    <style>
      @keyframes float1 {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-10px) scale(1.02); }
      }
      @keyframes float2 {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(8px) scale(0.98); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.6; transform: scale(1.15); }
      }
      @keyframes beamMove {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes orbMove {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(30px, -20px); }
      }
      .floating-node1 { animation: float1 6s ease-in-out infinite; }
      .floating-node2 { animation: float2 7s ease-in-out infinite; }
      .orb-glow { animation: orbMove 10s ease-in-out infinite alternate; }
      .beam-line {
        stroke-dasharray: 12, 12;
        animation: beamMove 8s linear infinite;
      }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="420" fill="url(#bgGrad)" rx="16" />
  <rect width="1200" height="420" fill="url(#gridPattern)" rx="16" />

  <!-- Animated Glowing Ambient Orbs (Background) -->
  <circle class="orb-glow" cx="150" cy="80" r="140" fill="#38bdf8" opacity="0.12" filter="url(#neonGlow)" />
  <circle class="orb-glow" cx="1050" cy="320" r="180" fill="#a855f7" opacity="0.15" filter="url(#neonGlow)" />
  <circle class="orb-glow" cx="600" cy="210" r="160" fill="#6366f1" opacity="0.1" filter="url(#neonGlow)" />

  <!-- Interactive Dynamic Background Graphic: Q&A Knowledge Exchange Network -->
  <g opacity="0.85">
    <!-- Connecting Knowledge Beams -->
    <path class="beam-line" d="M 820 100 C 920 140, 950 200, 1030 180" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="beam-line" d="M 880 320 C 960 280, 980 230, 1030 180" fill="none" stroke="#a855f7" stroke-width="2" />
    <path class="beam-line" d="M 750 220 C 800 220, 850 140, 900 130" fill="none" stroke="#818cf8" stroke-width="1.5" />

    <!-- Dynamic Graphic Cards (Positioned to the right side so foreground text remains completely unobstructed) -->
    <!-- Card 1: Question Card -->
    <g class="floating-node1" transform="translate(800, 70)">
      <rect width="240" height="75" rx="12" fill="url(#cardGrad1)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5" filter="url(#cardShadow)" />
      <circle cx="30" cy="38" r="16" fill="#0284c7" opacity="0.3" />
      <text x="30" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#38bdf8" text-anchor="middle">?</text>
      <text x="58" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">Q: Knowledge Silos?</text>
      <text x="58" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#94a3b8">Internal expertise discovery</text>
      <circle cx="218" cy="22" r="4" fill="#38bdf8">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" />
      </circle>
    </g>

    <!-- Card 2: AI / Community Answer Card -->
    <g class="floating-node2" transform="translate(930, 170)">
      <rect width="240" height="85" rx="12" fill="url(#cardGrad1)" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1.5" filter="url(#cardShadow)" />
      <circle cx="30" cy="42" r="16" fill="#9333ea" opacity="0.3" />
      <text x="30" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#c084fc" text-anchor="middle">✓</text>
      <text x="58" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">A: Verified Solution</text>
      <text x="58" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#cbd5e1">RAG Search + Peer Voting</text>
      <rect x="58" y="60" width="70" height="15" rx="4" fill="rgba(168, 85, 247, 0.25)" />
      <text x="93" y="71" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="bold" fill="#d8b4fe" text-anchor="middle">TOP ANSWER</text>
    </g>

    <!-- Card 3: Platform Metrics & Tags -->
    <g class="floating-node1" transform="translate(790, 275)">
      <rect width="250" height="70" rx="12" fill="url(#cardGrad1)" stroke="rgba(99, 102, 241, 0.4)" stroke-width="1.5" filter="url(#cardShadow)" />
      <circle cx="30" cy="35" r="16" fill="#4f46e5" opacity="0.3" />
      <text x="30" y="41" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#818cf8" text-anchor="middle">⚡</text>
      <text x="58" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#f8fafc">Self-Hosted &amp; SaaS</text>
      <text x="58" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#94a3b8">Apache Answer • Discourse • Onyx</text>
    </g>
  </g>

  <!-- FOREGROUND: Clear, prominent Title, Subtitle, and Tagline (strictly in front, crisp & readable) -->
  <g transform="translate(70, 0)">
    <!-- Category Pill -->
    <g transform="translate(0, 65)">
      <rect width="230" height="32" rx="16" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1" />
      <circle cx="16" cy="16" r="5" fill="#38bdf8" />
      <text x="30" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1">ENTERPRISE KNOWLEDGE</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      Awesome Enterprise
    </text>
    <text x="0" y="202" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="url(#accentGrad)" letter-spacing="-0.5">
      Question &amp; Answer Platform
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#94a3b8">
      Curated directory of enterprise Q&amp;A ecosystems, self-hosted answer engines,
    </text>
    <text x="0" y="276" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#94a3b8">
      community knowledge bases, and AI-powered internal search platforms.
    </text>

    <!-- Feature Pills / Badges in foreground -->
    <g transform="translate(0, 315)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="135" height="30" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
      <text x="67" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#e2e8f0" text-anchor="middle">🌐 SaaS &amp; Cloud</text>

      <!-- Pill 2 -->
      <rect x="145" y="0" width="145" height="30" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
      <text x="217" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#e2e8f0" text-anchor="middle">🔓 Open-Source Hub</text>

      <!-- Pill 3 -->
      <rect x="300" y="0" width="155" height="30" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
      <text x="377" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#e2e8f0" text-anchor="middle">🤖 GenAI &amp; RAG Q&amp;A</text>

      <!-- Pill 4 -->
      <rect x="465" y="0" width="165" height="30" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
      <text x="547" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#e2e8f0" text-anchor="middle">📊 Pricing &amp; Benchmarks</text>
    </g>
  </g>
</svg>
